name: 💡 Suggestion
description: Feature idea or improvement
title: "[Suggestion] "
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: "Search first: if the idea already exists, give it a 👍, that helps prioritize. Português? Pode abrir em português."
  - type: textarea
    id: idea
    attributes:
      label: What's the idea
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it make the game better
  - type: textarea
    id: refs
    attributes:
      label: References (other games, images)
