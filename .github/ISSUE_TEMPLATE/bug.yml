name: 🐞 Bug
description: Something isn't working as it should
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks! Please check the [wiki](https://defesatotal.netlify.app/wiki/) and [known bugs](https://defesatotal.netlify.app/bugs/) first. Português? Pode abrir em português."
  - type: input
    id: version
    attributes:
      label: Version / build
      description: Shown in the game menu
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: "e.g. Windows PC + Chrome, iPhone 13 + Safari"
    validations:
      required: true
  - type: input
    id: map
    attributes:
      label: Map
  - type: input
    id: wave
    attributes:
      label: Wave
  - type: input
    id: weapon
    attributes:
      label: Weapon / card in use
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Steps to reproduce, if possible
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot or video
      description: Drag the file here
