name: ⚖️ Balance
description: Something is too easy or too hard
title: "[Balance] "
labels: ["balance"]
body:
  - type: markdown
    attributes:
      value: "Português? Pode abrir em português."
  - type: input
    id: what
    attributes:
      label: What is unbalanced
      placeholder: "e.g. wave 10 boss, card X, level 3 sentry"
    validations:
      required: true
  - type: dropdown
    id: direction
    attributes:
      label: It is...
      options:
        - Too strong / too easy
        - Too weak / too hard
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: Map, wave and build
  - type: textarea
    id: details
    attributes:
      label: Details and suggested tweak
